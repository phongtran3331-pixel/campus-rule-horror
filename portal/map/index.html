<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园地图 · 节点检查</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #12151f;
    --panel2: #171b28;
    --line: #262b3d;
    --text: #e6e9f2;
    --dim: #8a91a8;
    --accent: #d33f2e;
    --accent2: #e8b04b;
    --ok: #4ade80;
    --a: #e8b04b;   /* A 类节点 */
    --b: #5b8dd9;   /* B 类节点 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -50%;
    background:
      radial-gradient(ellipse 40% 30% at 20% 30%, rgba(120,140,200,.05), transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 60%, rgba(120,140,200,.04), transparent 60%);
    animation: fog 26s linear infinite alternate;
    pointer-events: none;
  }
  @keyframes fog {
    from { transform: translate3d(-3%,-2%,0) scale(1); }
    to   { transform: translate3d(3%,2%,0) scale(1.06); }
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px;
    background: rgba(10,12,18,.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { font-size: 18px; letter-spacing: 4px; }
  .topbar h1 a { color: inherit; text-decoration: none; }
  .topbar h1 a:hover { color: var(--accent2); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--dim); border: 0; cursor: pointer;
    padding: 7px 16px; font-size: 13px; letter-spacing: 1px;
    font-family: inherit; transition: all .15s;
  }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .legend { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .legend .la i { background: var(--a); }
  .legend .lb i { background: var(--b); }

  .layout {
    display: grid; grid-template-columns: minmax(0,1.5fr) minmax(320px,1fr);
    gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  /* ---------- 地图 ---------- */
  .mapbox {
    position: relative; border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; background: var(--panel);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .mapbox img.bg { width: 100%; display: block; user-select: none; }
  .mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .edge { stroke: rgba(230,233,242,.16); stroke-width: .35; stroke-dasharray: 1.4 1.1; }
  .node { cursor: pointer; }
  .node .node-name {
    fill: #dfe3ef; font-size: 2.7px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(5,6,10,.9); stroke-width: .6;
    letter-spacing: .2px; transition: fill .15s;
  }
  .node .node-sub {
    fill: #7d8499; font-size: 1.8px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(5,6,10,.9); stroke-width: .5;
    opacity: 0; transition: opacity .15s;
  }
  .node:hover .node-name, .node.sel .node-name { fill: #e8b04b; }
  .node:hover .node-sub, .node.sel .node-sub { opacity: 1; }
  .node.sel .node-name { font-weight: 700; }
  .crumb {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    display: flex; gap: 8px; align-items: center;
    background: rgba(10,12,18,.82); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--dim);
  }
  .crumb b { color: var(--text); font-weight: 600; }
  .crumb button {
    background: none; border: 0; color: var(--accent2); cursor: pointer;
    font-family: inherit; font-size: 12px; padding: 0;
  }
  .crumb button:hover { text-decoration: underline; }

  /* ---------- 侧栏 ---------- */
  .panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px;
  }
  .card h2 { font-size: 16px; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; letter-spacing: 1px; border-radius: 5px; padding: 2px 8px;
    border: 1px solid;
  }
  .badge.A { color: var(--a); border-color: rgba(232,176,75,.45); }
  .badge.B { color: var(--b); border-color: rgba(91,141,217,.45); }
  .meta { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .meta dt { color: var(--dim); white-space: nowrap; }
  .meta dd { color: var(--text); line-height: 1.7; }
  .rooms { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .room {
    position: relative; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel2); padding: 12px 10px 10px; cursor: pointer;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    text-align: center;
  }
  .room:hover { transform: translateY(-3px); border-color: rgba(232,176,75,.5); box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .room .rn { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  .room .rk { margin-top: 6px; font-size: 11px; color: var(--dim); }
  .room .kdot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; }
  .room.none { border-style: dashed; opacity: .45; cursor: not-allowed; }
  .room.none:hover { transform: none; border-color: var(--line); box-shadow: none; }
  .room.none .rn { color: var(--dim); }

  .floors { display: flex; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; }
  .floors button {
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 13px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .floors button.on { color: var(--text); border-color: var(--accent2); }
  .hintline { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.8; }

  /* 房间详情浮层 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(4,5,9,.66);
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: min(480px, 100%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 26px 26px 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
  .modal h3 { font-size: 19px; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
  .modal .where { margin-top: 6px; font-size: 12px; color: var(--dim); }
  .modal .desc { margin-top: 14px; font-size: 13.5px; line-height: 2; color: var(--text); }
  .modal .tags { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .modal .tags span {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 11px; letter-spacing: 1px;
  }
  .modal .close {
    margin-top: 20px; width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px; cursor: pointer;
    font-family: inherit; font-size: 13px; letter-spacing: 3px;
  }
  .modal .close:hover { border-color: var(--accent2); color: var(--accent2); }
</style>
</head>
<body>

<header class="topbar">
  <h1><a href="../">‹ 校园规则怪谈</a> / 校园地图</h1>
  <div class="seg" id="timeSeg">
    <button data-t="day" class="on">白天</button>
    <button data-t="evening">夜晚</button>
  </div>
  <div class="legend">
    <span class="la"><i></i>A 类·有子房间</span>
    <span class="lb"><i></i>B 类·开放空间</span>
  </div>
</header>

<div class="layout">
  <!-- 左：地图 -->
  <div class="mapbox" id="mapbox">
    <img class="bg" id="mapBg" src="../assets/map-day.jpg" alt="校园地图" draggable="false">
    <svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div class="crumb" id="crumb" hidden>
      <button id="crumbBack">‹ 返回全图</button><span>/</span><b id="crumbHere"></b>
    </div>
  </div>

  <!-- 右：信息面板 -->
  <div class="panel" id="panel"></div>
</div>

<!-- 房间详情 -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div class="where" id="mWhere"></div>
    <div class="desc" id="mDesc"></div>
    <div class="tags" id="mTags"></div>
    <button class="close" id="mClose">关 闭</button>
  </div>
</div>

<script>

  ["dorm","canteen"],["dorm","community"],["dorm","library"],["dorm","field"],["dorm","recycle"],

  ["community","canteen"],["community","tA"],
  ["canteen","library"],["canteen","market"],["canteen","gate"],["canteen","tA"],

  ["tA","tB"],["tB","tC"],["tA","admin"],["tA","library"],["tC","admin"],["tC","clinic"],
  ["admin","gate"],["admin","clinic"],["admin","library"],["library","gate"],

/* 房间类型 → 圆点颜色 */
const KINDS = {
  "功能":"#4ade80", "物资":"#e8b04b", "上课":"#5b8dd9",

/* ---- 教学楼：大厅 + 4 层 × 4 间；404 不存在（F6）；上课教室按日轮换（F2） ---- */
function teachingRooms(bid, bname) {
  const rooms = [{ id:bid+":hall", name:"一楼大厅", kind:"功能",
    desc:"进入教学楼默认位于大厅。同楼玩家名单在此处可见——他们的具体房间号也一清二楚。" }];
  const inSession = { tA:["201","303"], tB:["202"], tC:["301"] }; // Day 1 示例
  for (let f=1; f<=4; f++) {
    for (let i=1; i<=4; i++) {
      const no = f*100+i;
      if (no === 404) {
        rooms.push({ id:bid+":404", name:"404", kind:"幻觉", none:true,
          desc:"不存在的教室。门牌会出现在走廊尽头，SAN 越低越逼真。进入即违反 F6。" });
        continue;
      }
      const kind = inSession[bid].includes(String(no)) ? "上课" : (f===4 ? "幻觉" : "物资");
      rooms.push({ id:bid+":"+no, name:String(no), kind,
        desc: kind==="上课"
          ? "今日有课。门缝透出灯光与板书声，进入即打扰教学（F2，当场 HP−10 SAN−10）。"
          : kind==="幻觉"
          ? "空教室。桌椅蒙尘，但总觉得有人刚离开。探索可得笔记与杂物，SAN 低时此处会发生怪事。"
          : "普通教室。课桌抽屉里可能有上一届留下的笔记与杂物。" });
    }
  }
  return rooms;
}

      { id:"admin:hall",    name:"大厅",   kind:"功能", desc:"进入默认位置。HP>80 者进入即违规（R7）。" },
      { id:"admin:camera",  name:"影像室", kind:"功能", desc:"监控：干事每日 3 次查全图节点级位置（理事长不限次）；双方查询均留痕——超量使用可反推理事长。" },
      { id:"admin:net",     name:"网络中心", kind:"功能", desc:"剪网线（剪刀 1.5 min）/ 杠铃杆破坏（4 min）；修复 1 AP，断网半天（4 min）自动恢复。断网时全员失去视野。" },
      { id:"admin:print",   name:"文印室", kind:"功能", desc:"查阅卡产出地：每日 1 张，先到先得，持久可交易。复印机偶尔会印出写满你名字的纸。" },
    ]},
  gate: { ap:"2 AP", out:"杂物、重要物品", risk:"低", tone:"门卫 NPC；永远打不开的门",
    rooms:[
      { id:"gate:guard", name:"门卫室", kind:"功能", desc:"\"今天没有请假单。\"他从来不说第二句话。交重要物品可换报酬。" },
      { id:"gate:bar",   name:"闸机",   kind:"幻觉", desc:"门把手是湿的。试图出门需要 SAN 判定。" },
      { id:"gate:board", name:"告示栏", kind:"物资", desc:"贴满通报与处分决定。其中一张的日期是明天。" },
    ]},
};

/* ================= 渲染 ================= */
const svg = document.getElementById("mapSvg");
const panel = document.getElementById("panel");
const crumb = document.getElementById("crumb");
let sel = null, inNode = null, floor = 1;

function nodeById(id){ return NODES.find(n=>n.id===id); }

function drawMap() {
  svg.innerHTML = "";
  const pos = Object.fromEntries(NODES.map(n=>[n.id,n]));
  EDGES.forEach(([a,b])=>{
    const l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",pos[a].x); l.setAttribute("y1",pos[a].y);
    l.setAttribute("x2",pos[b].x); l.setAttribute("y2",pos[b].y);
    l.setAttribute("class","edge");
    svg.appendChild(l);
  });
  NODES.forEach(n=>{
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(sel===n.id?" sel":""));
    const sub = DETAIL[n.id].rooms.length;
    g.innerHTML = `
      <rect x="${n.x-8}" y="${n.y-4}" width="16" height="8" fill="transparent"></rect>
      <text class="node-name" x="${n.x}" y="${n.y}">${n.name}</text>
      <text class="node-sub" x="${n.x}" y="${n.y+3.4}">${n.type==="A"?sub+" 房间":"开放"}</text>`;
    g.addEventListener("click",()=>select(n.id));
    svg.appendChild(g);
  });
}

function select(id) {
  sel = id; inNode = null; floor = 1;
  crumb.hidden = true;
  drawMap(); renderPanel();
}

function enterNode(id) {
  inNode = id; floor = 1;
  crumb.hidden = false;
  document.getElementById("crumbHere").textContent = nodeById(id).name + " · 内部";
  renderPanel();
}

document.getElementById("crumbBack").onclick = () => { select(sel); };

function roomCard(r) {
  const c = KINDS[r.kind] || "#94a3b8";
  return `<div class="room ${r.none?"none":""}" data-rid="${r.id}">
    ${r.none?"":`<span class="kdot" style="background:${c};box-shadow:0 0 6px ${c}"></span>`}
    <div class="rn">${r.name}</div></div>`;
}

function renderPanel() {
  const n = nodeById(sel);
  if (!n) { panel.innerHTML = `<div class="card"><h2>校园地图</h2>
    <p class="hintline">点击地图上的节点查看详情；A 类节点可"进入"查看子房间结构。本页仅供检查节点功能，不触发任何事件。</p></div>`; return; }
  const d = DETAIL[n.id];
  let inner = "";

  if (!inNode) {
    inner = `<div class="card">
      <h2>${n.name} <span class="badge ${n.type}">${n.type==="A"?"A 类 · 有子房间":"B 类 · 开放空间"}</span></h2>
      <dl class="meta">
        <dt>探索消耗</dt><dd>${d.ap}</dd>
        <dt>主要产出</dt><dd>${d.out}</dd>
        <dt>风险</dt><dd>${d.risk}</dd>
        <dt>基调</dt><dd>${d.tone}</dd>
      </dl>
      <div class="rooms">${d.rooms.map(roomCard).join("")}</div>
      <p class="hintline">点击房间查看说明；${n.type==="A"?"已进入节点内部视角":"B 类节点无独立房间，以上为功能点"}。</p>
    </div>`;
  } else {
    const rooms = d.rooms;
    const isTeaching = /^t[ABC]$/.test(n.id);
    let list = rooms;
    if (isTeaching) {
      const hall = rooms.filter(r=>r.id.endsWith(":hall"));
      const floorRooms = rooms.filter(r=>!r.id.endsWith(":hall") && Number(r.id.split(":")[1][0])===floor);
      list = [...hall, ...floorRooms];
    }
    inner = `<div class="card">
      <h2>${n.name} <span class="badge A">内部结构</span></h2>
      ${isTeaching?`<div class="floors">${[1,2,3,4].map(f=>
        `<button data-f="${f}" class="${f===floor?"on":""}">${f} 层</button>`).join("")}</div>`:""}
      <div class="rooms">${list.map(roomCard).join("")}</div>
      <p class="hintline">共 ${rooms.length} 个子位置（含大厅）。黄色=功能，蓝=上课，红=幻觉，紫=挑战，青=交易。</p>
    </div>`;
  }
  panel.innerHTML = inner;

  panel.querySelectorAll(".room:not(.none)").forEach(el=>{
    el.onclick = () => showRoom(el.dataset.rid);
  });
  panel.querySelectorAll(".floors button").forEach(b=>{
    b.onclick = () => { floor = Number(b.dataset.f); renderPanel(); };
  });
}

function showRoom(rid) {
  const all = Object.values(DETAIL).flatMap(d=>d.rooms);
  const r = all.find(x=>x.id===rid);
  if (!r) return;
  const nid = rid.split(":")[0];
  document.getElementById("mTitle").innerHTML =
    `${r.name} <span class="badge" style="color:${KINDS[r.kind]};border-color:${KINDS[r.kind]}55">${r.kind}</span>`;
  document.getElementById("mWhere").textContent = nodeById(nid).name + " · 子位置 " + rid;
  document.getElementById("mDesc").textContent = r.desc;
  document.getElementById("mTags").innerHTML = ["节点检查模式", "不触发事件", "坐标已校准"]
    .map(t=>`<span>${t}</span>`).join("");
  document.getElementById("mask").classList.add("show");
}
document.getElementById("mClose").onclick = () =>
  document.getElementById("mask").classList.remove("show");
document.getElementById("mask").addEventListener("click", e=>{
  if (e.target.id==="mask") e.target.classList.remove("show");
});

/* 日夜切换 */
document.getElementById("timeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#timeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("mapBg").src = b.dataset.t==="day"
    ? "../assets/map-day.jpg" : "../assets/map-evening.jpg";
});

drawMap();
renderPanel();
</script>
</body>
</html>
