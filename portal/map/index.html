<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园地图 · 节点检查</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #12151f;
    --panel2: #171b28;
    --line: #262b3d;
    --text: #e6e9f2;
    --dim: #8a91a8;
    --accent: #d33f2e;
    --accent2: #e8b04b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -50%;
    background:
      radial-gradient(ellipse 40% 30% at 20% 30%, rgba(120,140,200,.05), transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 60%, rgba(120,140,200,.04), transparent 60%);
    animation: fog 26s linear infinite alternate;
    pointer-events: none;
  }
  @keyframes fog {
    from { transform: translate3d(-3%,-2%,0) scale(1); }
    to   { transform: translate3d(3%,2%,0) scale(1.06); }
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px;
    background: rgba(10,12,18,.88); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { font-size: 18px; letter-spacing: 4px; }
  .topbar h1 a { color: inherit; text-decoration: none; }
  .topbar h1 a:hover { color: var(--accent2); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--dim); border: 0; cursor: pointer;
    padding: 7px 16px; font-size: 13px; letter-spacing: 1px;
    font-family: inherit; transition: all .15s;
  }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .legend { margin-left: auto; font-size: 12px; color: var(--dim); }
  .legend b { color: var(--text); }

  .layout {
    display: grid; grid-template-columns: minmax(0,1.5fr) minmax(320px,1fr);
    gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  /* ---------- 地图 / 场景图 ---------- */
  .mapbox {
    position: relative; border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; background: var(--panel);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .mapbox img.bg { width: 100%; display: block; user-select: none; }
  .mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .edge { stroke: rgba(230,233,242,.16); stroke-width: .35; stroke-dasharray: 1.4 1.1; }
  .node { cursor: pointer; }
  .node .node-name {
    fill: #dfe3ef; font-size: 2.7px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(5,6,10,.9); stroke-width: .6;
    letter-spacing: .2px; transition: fill .15s;
  }
  .node .node-sub {
    fill: #7d8499; font-size: 1.8px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(5,6,10,.9); stroke-width: .5;
    opacity: 0; transition: opacity .15s;
  }
  .node:hover .node-name, .node.sel .node-name { fill: #e8b04b; }
  .node:hover .node-sub, .node.sel .node-sub { opacity: 1; }
  .node.sel .node-name { font-weight: 700; }
  .crumb {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    display: flex; gap: 8px; align-items: center;
    background: rgba(10,12,18,.82); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--dim);
  }
  .crumb b { color: var(--text); font-weight: 600; }
  .crumb button {
    background: none; border: 0; color: var(--accent2); cursor: pointer;
    font-family: inherit; font-size: 12px; padding: 0;
  }
  .crumb button:hover { text-decoration: underline; }

  /* ---------- 侧栏 ---------- */
  .panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px;
  }
  .card h2 { font-size: 16px; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; letter-spacing: 1px; border-radius: 5px; padding: 2px 8px;
    border: 1px solid;
  }
  .badge.A { color: var(--accent2); border-color: rgba(232,176,75,.45); }
  .badge.B { color: #5b8dd9; border-color: rgba(91,141,217,.45); }
  .meta { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .meta dt { color: var(--dim); white-space: nowrap; }
  .meta dd { color: var(--text); line-height: 1.7; }
  .rooms { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .room {
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel2); padding: 12px 10px;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    text-align: center; cursor: pointer;
    font-size: 14px; font-weight: 600; letter-spacing: 1px;
  }
  .room:hover { transform: translateY(-3px); border-color: rgba(232,176,75,.5); box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .room.none { border-style: dashed; opacity: .4; cursor: default; }
  .room.none:hover { transform: none; border-color: var(--line); box-shadow: none; }
  .room.viewing { border-color: var(--accent2); color: var(--accent2); }

  .floors { display: flex; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; }
  .floors button {
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 13px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .floors button.on { color: var(--text); border-color: var(--accent2); }
  .hintline { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.8; }
</style>
</head>
<body>

<header class="topbar">
  <h1><a href="../">‹ 校园规则怪谈</a> / 校园地图</h1>
  <div class="seg" id="timeSeg">
    <button data-t="day" class="on">白天</button>
    <button data-t="evening">夜晚</button>
  </div>
  <div class="legend">点击节点查看结构 · 点击房间名切换场景图</div>
</header>

<div class="layout">
  <div class="mapbox" id="mapbox">
    <img class="bg" id="mapBg" src="../assets/map-day.jpg" alt="校园地图" draggable="false">
    <svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div class="crumb" id="crumb" hidden>
      <button id="crumbBack">‹ 返回地图</button><span>/</span><b id="crumbHere"></b>
    </div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script>
/* ================= 数据（与 server/src/data/map.ts 对齐） ================= */
const NODES = [
  { id:"dorm",      name:"宿舍",     x:13, y:51, type:"B" },
  { id:"canteen",   name:"食堂",     x:44, y:37, type:"B" },
  { id:"clinic",    name:"校医院",   x:94, y:59, type:"B" },
  { id:"market",    name:"超市",     x:68, y:70, type:"B" },
  { id:"tA",        name:"教学楼A",  x:66, y:29, type:"A" },
  { id:"tB",        name:"教学楼B",  x:77, y:24, type:"A" },
  { id:"tC",        name:"教学楼C",  x:81, y:31, type:"A" },
  { id:"library",   name:"图书馆",   x:39, y:71, type:"A" },
  { id:"field",     name:"操场",     x:24, y:26, type:"B" },
  { id:"community", name:"学生社区", x:46, y:12, type:"A" },
  { id:"recycle",   name:"回收站",   x:11, y:18, type:"B" },
  { id:"gym",       name:"体育馆",   x:28, y:9,  type:"A" },
  { id:"admin",     name:"行政楼",   x:69, y:53, type:"A" },
  { id:"gate",      name:"学校大门", x:45, y:84, type:"B" },
];
const EDGES = [
  ["dorm","canteen"],["dorm","community"],["dorm","library"],["dorm","field"],["dorm","recycle"],
  ["field","gym"],["field","canteen"],["recycle","gym"],["recycle","community"],
  ["community","canteen"],["community","tA"],
  ["canteen","library"],["canteen","market"],["canteen","gate"],["canteen","tA"],
  ["market","library"],["market","gate"],["market","clinic"],
  ["tA","tB"],["tB","tC"],["tA","admin"],["tA","library"],["tC","admin"],["tC","clinic"],
  ["admin","gate"],["admin","clinic"],["admin","library"],["library","gate"],
];

/* ---- 教学楼：大厅 + 4 层 × 4 间；404 不存在（F6） ---- */
function teachingRooms(bid) {
  const rooms = [{ id:bid+":hall", name:"一楼大厅" }];
  for (let f=1; f<=4; f++)
    for (let i=1; i<=4; i++) {
      const no = f*100+i;
      rooms.push(no === 404
        ? { id:bid+":404", name:"404", none:true }
        : { id:bid+":"+no, name:String(no) });
    }
  return rooms;
}

/* ---- 各节点子位置 ---- */
const DETAIL = {
  dorm: { ap:"睡觉 2 AP", out:"—", risk:"低（安全区）", tone:"门牌确认（R12）、空床起伏",
    rooms:[{id:"dorm:bed",name:"寝室床位"},{id:"dorm:door",name:"门牌"},{id:"dorm:wash",name:"盥洗室"}]},
  canteen: { ap:"进餐 ~3 币", out:"便宜食物、咖啡券", risk:"低", tone:"四号窗口（R9）、拼桌、菜里的硬物",
    rooms:[{id:"canteen:win4",name:"四号窗口"},{id:"canteen:table",name:"餐桌区"},{id:"canteen:kitchen",name:"后厨"}]},
  clinic: { ap:"2 AP", out:"药物（急救包/镇定剂）、校医任务", risk:"无", tone:"换药、体检单",
    rooms:[{id:"clinic:pharm",name:"药房"},{id:"clinic:infuse",name:"输液区"},{id:"clinic:doctor",name:"校医室"}]},
  market: { ap:"2 AP", out:"食物、剪刀（30币）、咖啡券", risk:"低", tone:"老板娘 NPC（R6）、自动售货机记录",
    rooms:[{id:"market:shelf",name:"货架区"},{id:"market:auto",name:"自动售货机"},{id:"market:cash",name:"收银台"}]},
  tA: { ap:"3 AP", out:"笔记(中)、杂物", risk:"中", tone:"幻觉教室、上课铃", rooms: teachingRooms("tA") },
  tB: { ap:"3 AP", out:"笔记(中)、杂物", risk:"中", tone:"上课铃",           rooms: teachingRooms("tB") },
  tC: { ap:"3 AP", out:"笔记(中)、杂物", risk:"高", tone:"尽头的阶梯教室、多出来的电梯", rooms: teachingRooms("tC") },
  library: { ap:"3 AP", out:"笔记(高)", risk:"中", tone:"写着你名字的书架、闸机记录",
    rooms:[{id:"library:hall",name:"大厅"},{id:"library:read",name:"阅览室"},{id:"library:stack",name:"书库区"},{id:"library:study",name:"自习区"}]},
  field: { ap:"运动：耗饥饿", out:"—", risk:"低", tone:"夜跑者、红校服（R9）、闸机记录",
    rooms:[{id:"field:track",name:"跑道"},{id:"field:stand",name:"看台"},{id:"field:corner",name:"器材角"}]},
  community: { ap:"预约制", out:"钥匙、档案、破译、表彰、担保", risk:"中", tone:"闸机进出记录",
    rooms:[{id:"community:front",name:"前台"},{id:"community:office",name:"办公室"},{id:"community:dept",name:"社区部"},{id:"community:cce",name:"策创部"},{id:"community:press",name:"宣传部"},{id:"community:cafe",name:"时光里的咖啡屋"}]},
  recycle: { ap:"1 AP", out:"杂物换币（3–8 币/件）", risk:"无", tone:"回收站大爷 NPC、秤",
    rooms:[{id:"recycle:desk",name:"回收柜台"},{id:"recycle:pile",name:"杂物堆"}]},
  gym: { ap:"付费 10 币 + 运动", out:"体育运动物资（回收价值高）、杠铃杆", risk:"中", tone:"深夜的球场、消失的更衣柜",
    rooms:[{id:"gym:front",name:"前台"},{id:"gym:machine",name:"器械区"},{id:"gym:court",name:"球场"},{id:"gym:locker",name:"储物间"}]},
  admin: { ap:"3 AP", out:"查阅卡、监控、网络中心", risk:"中", tone:"影像室、文印室",
    rooms:[{id:"admin:hall",name:"大厅"},{id:"admin:camera",name:"影像室"},{id:"admin:net",name:"网络中心"},{id:"admin:print",name:"文印室"}]},
  gate: { ap:"2 AP", out:"杂物、重要物品", risk:"低", tone:"门卫 NPC；永远打不开的门",
    rooms:[{id:"gate:guard",name:"门卫室"},{id:"gate:bar",name:"闸机"},{id:"gate:board",name:"告示栏"}]},
};

/* ================= 渲染 ================= */
const svg = document.getElementById("mapSvg");
const panel = document.getElementById("panel");
const mapBg = document.getElementById("mapBg");
const crumb = document.getElementById("crumb");
let sel = null, inNode = null, floor = 1, timeOfDay = "day", viewing = null;

const nodeById = id => NODES.find(n=>n.id===id);
const baseMap = () => `../assets/map-${timeOfDay}.jpg`;

function drawMap() {
  svg.innerHTML = "";
  const pos = Object.fromEntries(NODES.map(n=>[n.id,n]));
  EDGES.forEach(([a,b])=>{
    const l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",pos[a].x); l.setAttribute("y1",pos[a].y);
    l.setAttribute("x2",pos[b].x); l.setAttribute("y2",pos[b].y);
    l.setAttribute("class","edge");
    svg.appendChild(l);
  });
  NODES.forEach(n=>{
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(sel===n.id?" sel":""));
    const sub = DETAIL[n.id].rooms.length;
    g.innerHTML = `
      <rect x="${n.x-8}" y="${n.y-4}" width="16" height="8" fill="transparent"></rect>
      <text class="node-name" x="${n.x}" y="${n.y}">${n.name}</text>
      <text class="node-sub" x="${n.x}" y="${n.y+3.4}">${n.type==="A"?sub+" 房间":"开放"}</text>`;
    g.addEventListener("click",()=>select(n.id));
    svg.appendChild(g);
  });
}

function showMap() {
  viewing = null;
  crumb.hidden = true;
  mapBg.src = baseMap();
  renderPanel();
}

function select(id) {
  sel = id; inNode = null; floor = 1;
  showMap();
  drawMap();
}

function enterNode(id) {
  inNode = id; floor = 1;
  crumb.hidden = false;
  document.getElementById("crumbHere").textContent = nodeById(id).name + " · 内部";
  renderPanel();
}
document.getElementById("crumbBack").onclick = showMap;

function roomCard(r) {
  return `<div class="room ${r.none?"none":""} ${viewing===r.id?"viewing":""}" data-rid="${r.id}">${r.name}</div>`;
}

function renderPanel() {
  const n = nodeById(sel);
  if (!n) { panel.innerHTML = `<div class="card"><h2>校园地图</h2>
    <p class="hintline">点击地图上的节点查看结构；点击房间名切换左侧场景图（有图的房间才会切换）。</p></div>`; return; }
  const d = DETAIL[n.id];
  let inner;

  if (!inNode) {
    inner = `<div class="card">
      <h2>${n.name} <span class="badge ${n.type}">${n.type==="A"?"A 类":"B 类"}</span></h2>
      <dl class="meta">
        <dt>探索消耗</dt><dd>${d.ap}</dd>
        <dt>主要产出</dt><dd>${d.out}</dd>
        <dt>风险</dt><dd>${d.risk}</dd>
        <dt>基调</dt><dd>${d.tone}</dd>
      </dl>
      <div class="rooms">${d.rooms.map(roomCard).join("")}</div>
    </div>`;
  } else {
    const rooms = d.rooms;
    const isTeaching = /^t[ABC]$/.test(n.id);
    let list = rooms;
    if (isTeaching) {
      const hall = rooms.filter(r=>r.id.endsWith(":hall"));
      const floorRooms = rooms.filter(r=>!r.id.endsWith(":hall") && Number(r.id.split(":")[1][0])===floor);
      list = [...hall, ...floorRooms];
    }
    inner = `<div class="card">
      <h2>${n.name} <span class="badge A">内部结构</span></h2>
      ${isTeaching?`<div class="floors">${[1,2,3,4].map(f=>
        `<button data-f="${f}" class="${f===floor?"on":""}">${f} 层</button>`).join("")}</div>`:""}
      <div class="rooms">${list.map(roomCard).join("")}</div>
      <p class="hintline">共 ${rooms.length} 个子位置（含大厅）。</p>
    </div>`;
  }
  panel.innerHTML = inner;

  panel.querySelectorAll(".room:not(.none)").forEach(el=>{
    el.onclick = () => tryRoomView(el.dataset.rid);
  });
  panel.querySelectorAll(".floors button").forEach(b=>{
    b.onclick = () => { floor = Number(b.dataset.f); renderPanel(); };
  });
}

/* 点击房间：有才切场景图，没有就没反应 */
function tryRoomView(rid) {
  const nid = rid.split(":")[0];
  const r = DETAIL[nid].rooms.find(x=>x.id===rid);
  if (!r) return;
  const img = new Image();
  img.onload = () => {
    viewing = rid;
    mapBg.src = img.src;
    crumb.hidden = false;
    document.getElementById("crumbHere").textContent = `${nodeById(nid).name} · ${r.name}`;
    renderPanel();
  };
  img.src = `../assets/rooms/${rid.replace(":","-")}.jpg`;
}

/* 日夜切换 */
document.getElementById("timeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#timeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  timeOfDay = b.dataset.t;
  if (!viewing) mapBg.src = baseMap();
});

drawMap();
renderPanel();
</script>
</body>
</html>
