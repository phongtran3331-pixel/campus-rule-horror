      - name: Persist build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build-output.log', 'utf8').slice(-30000);
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'ci/build-output.log', ref: 'ci-debug',
              });
              sha = data.sha;
            } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: 'ci/build-output.log', branch: 'ci-debug',
              message: 'ci: build output',
              content: Buffer.from(log).toString('base64'),
              ...(sha ? { sha } : {}),
            });
