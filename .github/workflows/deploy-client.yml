name: Deploy Client (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/deploy-client.yml", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: write # CI 调试：失败时把构建日志写回仓库 ci/ 分支
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          GH_PAGES: "1"
        run: |
          npm run build -w client 2>&1 | tee build-output.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Persist build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build-output.log', 'utf8').slice(-30000);
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'ci/build-output.log', ref: 'ci-debug',
              });
              sha = data.sha;
            } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: 'ci/build-output.log', branch: 'ci-debug',
              message: 'ci: build output',
              content: Buffer.from(log).toString('base64'),
              ...(sha ? { sha } : {}),
            });
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
