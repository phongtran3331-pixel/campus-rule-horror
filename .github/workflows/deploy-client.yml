name: Deploy Client (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["client/**", "portal/**", ".github/workflows/deploy-client.yml", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          GH_PAGES: "1"
          VITE_SERVER_URL: "ws://113.44.183.22:2567"
        run: npm run build -w client
      - name: Assemble site (portal + game)
        run: |
          mkdir -p site
          cp -r portal/. site/
          mkdir -p site/game
          cp -r client/dist/. site/game/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
